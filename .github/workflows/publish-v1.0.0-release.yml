name: Publish KPR-pipeline v1.0.0 release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source version
        run: |
          test "${GITHUB_REF_NAME}" = "main"
          test -s CITATION.cff
          test -s docs/RELEASE_NOTES_v1.0.0.md
          git fetch --no-tags origin refs/heads/pangenome-pop-analysis-v1.0
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists"
            exit 1
          fi
          if git show-ref --verify --quiet refs/tags/v1.0.0; then
            echo "Tag v1.0.0 already exists"
            exit 1
          fi
          gh release create v1.0.0 --target "${GITHUB_SHA}" \
            --title "KPR-pipeline v1.0.0" \
            --notes-file docs/RELEASE_NOTES_v1.0.0.md
