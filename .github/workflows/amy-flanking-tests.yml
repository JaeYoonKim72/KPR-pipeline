name: AMY flanking pipeline smoke tests
on:
  pull_request:
    paths:
      - '8.Population_genetics_in_AMY_flanking_locus.sh'
      - '1.genome_assembly_and_statistics.sh'
      - 'src/genome_assembly_and_statistics.md'
      - 'src/filter_sv_caller_quality.py'
      - 'src/select_svim_asm_truvari.py'
      - 'src/tests/test_sv_truvari.py'
      - 'src/Variant_benchmark.md'
      - 'README.md'
      - '4.compare_pangenome_variant_counts.sh'
      - '3.pangenome_construction_and_statistics.sh'
      - '6.pangenome_short_read_mapping.sh'
      - 'src/decon_split.sh'
      - '4.pangenome_variant_comparison.sh'
      - 'src/compare_pangenome_variant_counts.md'
      - 'src/summarize_variant_comparison.py'
      - 'src/typecount.py'
      - 'src/tests/test_variant_comparison.py'
      - 'src/amy_flank_*.py'
      - 'src/tests/test_amy_flanking.py'
      - '.github/workflows/amy-flanking-tests.yml'
  push:
    branches: [amy-flanking-popgen-v1, pangenome-pop-analysis-v1]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bcftools and tabix
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bcftools tabix
      - name: Validate Bash scripts
        run: |
          bash -n 8.Population_genetics_in_AMY_flanking_locus.sh
          bash -n 7.AMY_locus_analysis_in_pagenomegraph.sh
          bash -n 2.Ensemble_gene_annotation.sh
          bash -n 5.Variant_benchmark.sh
          bash -n 6.pangenome_short_read_mapping.sh
          bash -n 3.pangenome_construction_and_statistics.sh
          bash -n 4.compare_pangenome_variant_counts.sh
          bash -n 1.genome_assembly_and_statistics.sh
          bash -n src/decon_split.sh
      - name: Check exact 50 bp vs 51 bp SV cutoff
        run: |
          mkdir -p /tmp/sv_cutoff
          python3 - <<'PY' > /tmp/sv_cutoff/size.vcf
          print("##fileformat=VCFv4.2")
          print("##contig=<ID=chr1,length=100000>")
          print("#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO")
          for pos, delta in [(100, 50), (200, 51)]:
              print(f"chr1\t{pos}\t.\tA\t{'A' * (delta + 1)}\t60\tPASS\t.")
          PY
          bcftools view -Oz -o /tmp/sv_cutoff/size.vcf.gz /tmp/sv_cutoff/size.vcf
          bash src/decon_split.sh /tmp/sv_cutoff/size.vcf.gz 50
          awk '$2 == 100 { found = 1 } END {exit !found}' /tmp/sv_cutoff/size.var_sizes.Smalls_list.txt
          awk '$2 == 200 { found = 1 } END {exit !found}' /tmp/sv_cutoff/size.var_sizes.SVs_list.txt
          ! awk '$2 == 100 { found = 1 } END {exit !found}' /tmp/sv_cutoff/size.var_sizes.SVs_list.txt
          ! awk '$2 == 200 { found = 1 } END {exit !found}' /tmp/sv_cutoff/size.var_sizes.Smalls_list.txt
      - name: Run synthetic Python smoke tests
        run: python3 -m unittest discover -s src/tests -p 'test_amy_flanking.py' -v
      - name: Check variant count formula
        run: python3 -m unittest discover -s src/tests -p 'test_variant_comparison.py' -v
      - name: Check SV caller quality thresholds and Truvari-match consensus
        run: python3 -m unittest discover -s src/tests -p 'test_sv_truvari.py' -v
      - name: Validate added Python helpers
        run: python3 -m py_compile src/filter_sv_caller_quality.py src/select_svim_asm_truvari.py
